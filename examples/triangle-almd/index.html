<!DOCTYPE html>
<html lang="en">
<head>
  <title>snaidhm — Almide WebGPU</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .canvas-container { position: relative; width: 512px; height: 512px; }
    canvas { width: 512px; height: 512px; display: block; }
    .text-overlay {
      position: absolute; top: 0; left: 0; width: 512px; height: 512px;
      pointer-events: none;
    }
    .text-overlay span, .text-overlay h1, .text-overlay h2, .text-overlay h3,
    .text-overlay h4, .text-overlay h5, .text-overlay h6 {
      position: absolute;
      pointer-events: auto;
      cursor: text;
      color: transparent;
      -webkit-user-select: text;
      user-select: text;
      white-space: nowrap;
      line-height: 1;
    }
    .text-overlay span::selection, .text-overlay h1::selection,
    .text-overlay h2::selection, .text-overlay h3::selection {
      background: rgba(66, 133, 244, 0.4);
      color: inherit;
    }

    /* Text input field */
    .input-area {
      position: absolute;
      pointer-events: auto;
      cursor: text;
      overflow: hidden;
    }
    .input-area .input-display {
      font-family: sans-serif;
      white-space: pre;
      min-height: 1.2em;
      color: #333;
      line-height: 1.2;
    }
    .input-area .input-display .cursor {
      display: inline-block;
      width: 1px;
      height: 1em;
      background: #333;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    .input-area .input-display .composition {
      text-decoration: underline;
      text-decoration-style: dotted;
    }
    .input-area .placeholder {
      color: #999;
      font-style: italic;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* IME textarea — overlaid on input area, visually transparent */
    .ime-textarea {
      position: absolute;
      color: transparent;
      caret-color: transparent;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      font-family: sans-serif;
      font-size: 11px;
      line-height: 1.2;
      padding: 0;
      margin: 0;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="canvas" width="512" height="512"></canvas>
    <div id="text-overlay" class="text-overlay"></div>
    <textarea id="ime-input" class="ime-textarea" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" rows="1"></textarea>
  </div>
  <script type="module">
    import { init, createTextOverlay, setupTextInput } from "./gpu_runtime.js";
    const canvas = document.getElementById("canvas");
    init("./snaidhm.wasm?v=" + Date.now(), canvas)
      .then(() => {
        createTextOverlay(document.getElementById("text-overlay"), canvas);
        setupTextInput(
          document.getElementById("text-overlay"),
          document.getElementById("ime-input"),
          canvas,
        );
      })
      .catch(e => { document.body.textContent = e.message; console.error(e); });
  </script>
</body>
</html>
